<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>boussole</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #101418; color: #e8ecf0;
      font: 16px/1.4 system-ui, sans-serif; }
    main { display: flex; flex-direction: column; height: 100dvh; }
    b-app { display: contents; }
    #view, b-plan, b-list, b-repere, b-carnet, b-settings { flex: 1; min-height: 0; display: block; overflow: auto; }
    nav { display: flex; border-top: 1px solid #2c3947; }
    nav button { flex: 1; min-height: 48px; background: none; border: 0; color: #9fb0c0;
      font: inherit; }
    nav button[aria-current="true"] { color: #e8ecf0; box-shadow: inset 0 2px 0 #58a0ff; }
    .plan-wrap { position: relative; height: 100%; }
    .plan-wrap canvas { position: absolute; inset: 0; touch-action: none; }
    .plan-wrap .hint, .plan-wrap .pos-label { position: absolute; left: 12px; margin: 0;
      background: rgba(16,20,24,.75); padding: 4px 8px; border-radius: 6px; font-size: 13px; }
    .plan-wrap .hint { top: 12px; }
    .plan-wrap .pos-label { bottom: 12px; color: #58a0ff; }
    ul.repere-list, ul.carnet, .settings ul { list-style: none; margin: 0; padding: 8px; }
    .repere-list button { width: 100%; min-height: 48px; text-align: left; background: #1b232c;
      border: 0; border-radius: 8px; color: inherit; font: inherit; padding: 12px; margin: 4px 0; }
    .repere-list small { display: block; color: #9fb0c0; }
    .repere-detail { padding: 16px; }
    blockquote.tableau { border-left: 3px solid #e8b93e; margin: 12px 0; padding: 4px 12px;
      color: #d8dee6; }
    button.checkin, .settings button { min-height: 48px; min-width: 48px; padding: 0 20px;
      border: 0; border-radius: 8px; background: #58a0ff; color: #101418; font: inherit; }
    button.danger { background: #d95757; }
    .card.error { margin: 24px; padding: 16px; background: #2c1b1b; border-radius: 8px; }
    .settings { padding: 16px; }
    .seen { color: #57d98e; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; }
    .debug { position: absolute; right: 8px; top: 8px; width: 260px; max-height: 70%;
      overflow: auto; background: rgba(16,20,24,.92); border: 1px solid #2c3947;
      border-radius: 8px; padding: 10px; font-size: 13px; }
    .debug h2 { margin: 0 0 8px; font-size: 14px; color: #e8b93e; }
    .debug label { display: block; margin: 2px 0; }
    .debug input { width: 130px; background: #1b232c; border: 1px solid #2c3947;
      color: inherit; border-radius: 4px; padding: 2px 6px; }
    .debug button, .debug select { min-height: 32px; margin: 2px 2px 2px 0;
      background: #2c3947; border: 0; border-radius: 6px; color: inherit; font: inherit; }
    .debug pre { font-size: 11px; white-space: pre-wrap; color: #9fb0c0; }
    .cadran-dock { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
      pointer-events: none; }
    .cadran { text-align: center; }
    .cadran-label { margin: 4px 0 0; font-size: 12px; color: #58a0ff;
      background: rgba(16,20,24,.75); border-radius: 6px; padding: 2px 8px; }
  </style>
</head>
<body>
  <main><p style="margin:auto">boussole…</p></main>
  <noscript>boussole nécessite JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
